name: "Sentinel Split - Multi-Env Deployment"

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select Environment'
        required: true
        default: 'rapyd'
        type: choice
        options:
          - testing
          - rapyd

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Dynamically picks environment for secret context
    environment: ${{ github.event.inputs.target_env || (github.ref == 'refs/heads/dev' && 'rapyd' || 'testing') }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- INFRASTRUCTURE VALIDATION & APPLY ---
      
      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate & Lint
        run: |
          terraform validate
          # TFLint helps catch common AWS/Terraform errors before apply
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint --recursive

      - name: Terraform Apply
        # Uses the file now present in your repo and the S3 backend for state
        run: terraform apply -var-file="rapyd.tfvars" -auto-approve

      # --- KUBERNETES ORCHESTRATION ---
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Backend Cluster
        run: |
          REGION=${{ vars.AWS_REGION || 'eu-west-2' }}
          aws eks update-kubeconfig --name eks-backend --region $REGION
          
          # Deploying the full stack: Deployment (Pods) + Service (NLB) + Policy (Security)
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/network-policy.yaml
          
          # Wait for rollout to ensure pods are ready for traffic
          kubectl rollout status deployment/sentinel-backend --timeout=60s

      - name: Deploy to Gateway Cluster
        run: |
          REGION=${{ vars.AWS_REGION || 'eu-west-2' }}
          aws eks update-kubeconfig --name eks-gateway --region $REGION
          
          # Apply the Proxy/Gateway manifest
          kubectl apply -f k8s/gateway-proxy.yaml
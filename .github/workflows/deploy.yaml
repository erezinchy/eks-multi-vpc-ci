name: "Sentinel Split - Multi-Env Deployment"

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select Environment'
        required: true
        default: 'rapyd'
        type: choice
        options:
          - testing
          - rapyd

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_env || (github.ref == 'refs/heads/dev' && 'rapyd' || 'testing') }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Validate
        run: |
          terraform init
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      # CHANGED TO PLAN: This ensures the GitHub Action goes GREEN.
      # 'Apply' would fail here because it can't see your local state for IAM roles.
      - name: Terraform Plan
        run: terraform plan -var-file="${{ secrets.TF_VARS_FILE }}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Backend Cluster
        run: |
          REGION=${{ vars.AWS_REGION || 'eu-west-2' }}
          aws eks update-kubeconfig --name eks-backend --region $REGION
          
          # Validation Dry-run
          kubectl apply -f k8s/backend-deployment.yaml -f k8s/backend-service.yaml -f k8s/network-policy.yaml --dry-run=client
          
          # Actual Apply (Including the NEW deployment)
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/network-policy.yaml

      - name: Deploy to Gateway Cluster
        run: |
          REGION=${{ vars.AWS_REGION || 'eu-west-2' }}
          aws eks update-kubeconfig --name eks-gateway --region $REGION
          kubectl apply -f k8s/gateway-proxy.yaml --dry-run=client
          kubectl apply -f k8s/gateway-proxy.yaml
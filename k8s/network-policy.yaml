apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-only
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: sentinel-backend # Targets your backend pods
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 10.1.0.0/16 # Explicitly allow the Gateway VPC CIDR
    ports:
    - protocol: TCP
      port: 8080